<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StreamOps Live Player</title>
    <!-- Hls.js Engine CDN -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>
    <style>
        :root {
            --bg-color: #080d1a;
            --accent-color: #0ea5e9;
            --live-color: #ef4444;
            --text-color: #f8fafc;
            --card-bg: rgba(15, 23, 42, 0.85);
            --border-color: rgba(51, 65, 85, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
        }

        .player-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            background: #000;
        }

        /* Top HUD Bar */
        .top-hud {
            position: absolute;
            top: 14px;
            left: 14px;
            right: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            pointer-events: none;
            z-index: 20;
        }

        .badge-group {
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: auto;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(8px);
        }

        .badge-live {
            color: #fff;
            border-color: rgba(239, 68, 68, 0.4);
            cursor: pointer;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--live-color);
            box-shadow: 0 0 8px var(--live-color);
            animation: pulseDot 1.5s infinite;
        }

        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        .badge-channel {
            color: var(--accent-color);
            border-color: rgba(14, 165, 233, 0.3);
            font-family: monospace;
        }

        .badge-mode {
            color: #38bdf8;
            font-size: 10px;
        }

        .hud-toggle-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: #94a3b8;
            border-radius: 8px;
            padding: 5px 9px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all 0.2s;
        }

        .hud-toggle-btn:hover {
            color: #fff;
            border-color: var(--accent-color);
        }

        /* Diagnostics Telemetry Panel */
        .telemetry-panel {
            position: absolute;
            top: 55px;
            right: 14px;
            width: 260px;
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            font-family: monospace;
            font-size: 11px;
            line-height: 1.6;
            backdrop-filter: blur(12px);
            z-index: 25;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            display: none;
        }

        .telemetry-panel.active {
            display: block;
        }

        .telemetry-title {
            font-size: 10px;
            font-weight: 700;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .telemetry-row {
            display: flex;
            justify-content: space-between;
            color: #94a3b8;
        }

        .telemetry-val {
            color: #f1f5f9;
            font-weight: 600;
        }

        /* Center Play Overlay */
        .center-overlay {
            position: absolute;
            inset: 0;
            background: rgba(8, 13, 26, 0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            z-index: 30;
            backdrop-filter: blur(4px);
            transition: opacity 0.3s;
        }

        .center-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .btn-play-trigger {
            background: linear-gradient(135deg, #0ea5e9, #0284c7);
            border: none;
            color: #fff;
            padding: 14px 28px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(14, 165, 233, 0.4);
            display: flex;
            align-items: center;
            gap: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-play-trigger:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 25px rgba(14, 165, 233, 0.6);
        }

        .status-msg {
            font-size: 12px;
            color: #94a3b8;
        }

        /* Loading Spinner */
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(14, 165, 233, 0.2);
            border-top-color: var(--accent-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="player-wrapper">
        <!-- Native Video Element -->
        <video id="video" playsinline webkit-playsinline controls></video>

        <!-- Dynamic Header Badges -->
        <div class="top-hud">
            <div class="badge-group">
                <div class="badge badge-live" id="badge-live-btn" title="Click to sync to live edge">
                    <span class="live-dot"></span>
                    <span>LIVE</span>
                </div>
                <div class="badge badge-channel" id="badge-channel-name">FEED</div>
                <div class="badge badge-mode" id="badge-stream-mode">DIRECT CDN</div>
            </div>

            <div class="badge-group">
                <button class="hud-toggle-btn" id="btn-toggle-hud" title="Toggle Stream Telemetry (Shortcut: D)">
                    STATS (D)
                </button>
            </div>
        </div>

        <!-- Floating Telemetry HUD -->
        <div class="telemetry-panel" id="telemetry-panel">
            <div class="telemetry-title">
                <span>Stream Telemetry</span>
                <span id="telemetry-latency-status">SYNCED</span>
            </div>
            <div class="telemetry-row">
                <span>Mode:</span>
                <span class="telemetry-val" id="tel-mode">-</span>
            </div>
            <div class="telemetry-row">
                <span>Resolution:</span>
                <span class="telemetry-val" id="tel-res">Detecting...</span>
            </div>
            <div class="telemetry-row">
                <span>Edge Latency:</span>
                <span class="telemetry-val" id="tel-latency">~1.8s</span>
            </div>
            <div class="telemetry-row">
                <span>Buffer Ahead:</span>
                <span class="telemetry-val" id="tel-buffer">0.0s</span>
            </div>
            <div class="telemetry-row">
                <span>Dropped Frames:</span>
                <span class="telemetry-val" id="tel-dropped">0</span>
            </div>
            <div class="telemetry-row">
                <span>Playlist Format:</span>
                <span class="telemetry-val" id="tel-format">Camouflaged HLS</span>
            </div>
        </div>

        <!-- Center Click to Play Prompt -->
        <div class="center-overlay" id="center-overlay">
            <div class="spinner" id="loading-spinner"></div>
            <p class="status-msg" id="status-msg">Connecting to live edge...</p>
            <button class="btn-play-trigger" id="btn-play-action" style="display: none;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M8 5v14l11-7z"/>
                </svg>
                <span>Play Live Stream</span>
            </button>
        </div>
    </div>

    <script>
        // Parse Query Parameters
        const params = new URLSearchParams(window.location.search);
        const channelParam = params.get('channel');
        const r2SlugParam = params.get('r2');
        const srcParam = params.get('src');
        const tokenParam = params.get('token');

        // UI Elements
        const video = document.getElementById('video');
        const centerOverlay = document.getElementById('center-overlay');
        const loadingSpinner = document.getElementById('loading-spinner');
        const statusMsg = document.getElementById('status-msg');
        const btnPlayAction = document.getElementById('btn-play-action');
        const badgeChannel = document.getElementById('badge-channel-name');
        const badgeMode = document.getElementById('badge-stream-mode');
        const badgeLiveBtn = document.getElementById('badge-live-btn');
        const btnToggleHud = document.getElementById('btn-toggle-hud');
        const telemetryPanel = document.getElementById('telemetry-panel');

        // Telemetry Elements
        const telMode = document.getElementById('tel-mode');
        const telRes = document.getElementById('tel-res');
        const telLatency = document.getElementById('tel-latency');
        const telBuffer = document.getElementById('tel-buffer');
        const telDropped = document.getElementById('tel-dropped');
        const telFormat = document.getElementById('tel-format');

        let hlsInstance = null;
        let streamManifestUrl = '';
        let playbackMode = 'Edge CDN';

        // Keyboard Shortcut 'D' to toggle HUD
        window.addEventListener('keydown', (e) => {
            if (e.key === 'd' || e.key === 'D') {
                toggleTelemetry();
            }
        });

        btnToggleHud.addEventListener('click', toggleTelemetry);

        function toggleTelemetry() {
            telemetryPanel.classList.toggle('active');
        }

        // Live Edge Sync
        badgeLiveBtn.addEventListener('click', () => {
            if (hlsInstance && hlsInstance.liveSyncPosition) {
                video.currentTime = hlsInstance.liveSyncPosition;
            }
        });

        // Resolve Target Stream URL
        async function resolveStream() {
            // Case 1: Direct src provided
            if (srcParam) {
                playbackMode = 'Direct Source';
                badgeChannel.innerText = 'CUSTOM';
                badgeMode.innerText = 'DIRECT';
                streamManifestUrl = srcParam;
                return initHls(streamManifestUrl);
            }

            // Case 2: Cloudflare R2 Direct Mode (?r2={random_slug})
            if (r2SlugParam) {
                playbackMode = 'Cloudflare R2 Direct';
                badgeChannel.innerText = r2SlugParam.substring(0, 8).toUpperCase();
                badgeMode.innerText = 'R2 ZERO-EGRESS';
                telFormat.innerText = 'R2 index.html (Camouflaged)';

                // Fetch R2 Custom Domain from backend config if accessible
                let r2Domain = 'r2-custom-domain.shop';
                try {
                    const cfgRes = await fetch('/api/config');
                    if (cfgRes.ok) {
                        const cfg = await cfgRes.json();
                        if (cfg.r2CustomDomain) r2Domain = cfg.r2CustomDomain;
                    }
                } catch (e) {
                    // Fallback to configured domain
                }

                streamManifestUrl = `https://${r2Domain}/hd/${r2SlugParam}/index.html`;
                return initHls(streamManifestUrl);
            }

            // Case 3: Nginx Edge Camouflaged Mode (?channel={channel})
            const channel = channelParam || 'match1';
            playbackMode = 'Nginx Edge Camouflage';
            badgeChannel.innerText = channel.toUpperCase();
            badgeMode.innerText = 'EDGE CDN (.CSS)';
            telFormat.innerText = 'index.css -> HLS Camouflage';

            let streamUrl = `/live/${channel}/index.css`;
            if (tokenParam) {
                streamUrl += `?token=${encodeURIComponent(tokenParam)}`;
            }

            streamManifestUrl = streamUrl;
            return initHls(streamManifestUrl);
        }

        // Initialize Hls.js with Camouflage Handlers & Low-Latency Tuning
        function initHls(url) {
            telMode.innerText = playbackMode;
            statusMsg.innerText = `Buffering: ${playbackMode}...`;

            if (Hls.isSupported()) {
                if (hlsInstance) {
                    hlsInstance.destroy();
                }

                hlsInstance = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                    backBufferLength: 30,
                    maxBufferLength: 8,
                    maxMaxBufferLength: 15,
                    liveSyncDurationCount: 3,
                    liveMaxLatencyDurationCount: 6,
                    liveDurationInfinity: true,
                    xhrSetup: function(xhr, requestUrl) {
                        // Pass token header if present
                        if (tokenParam) {
                            xhr.setRequestHeader('Authorization', `Bearer ${tokenParam}`);
                        }
                    }
                });

                hlsInstance.loadSource(url);
                hlsInstance.attachMedia(video);

                hlsInstance.on(Hls.Events.MANIFEST_PARSED, (event, data) => {
                    statusMsg.innerText = 'Stream manifest loaded. Playing...';
                    attemptAutoplay();
                });

                hlsInstance.on(Hls.Events.LEVEL_LOADED, (event, data) => {
                    if (data.details.live) {
                        const latency = data.details.totalduration - video.currentTime;
                        if (!isNaN(latency) && latency > 0) {
                            telLatency.innerText = `${latency.toFixed(1)}s`;
                        }
                    }
                });

                hlsInstance.on(Hls.Events.ERROR, (event, data) => {
                    console.warn('[HLS-WARN]', data.type, data.details);
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                statusMsg.innerText = 'Network error. Reconnecting to live stream...';
                                setTimeout(() => hlsInstance.startLoad(), 2000);
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                statusMsg.innerText = 'Media decoding error. Recovering...';
                                hlsInstance.recoverMediaError();
                                break;
                            default:
                                statusMsg.innerText = 'Stream offline or waiting for ingest. Retrying...';
                                setTimeout(() => hlsInstance.loadSource(url), 3000);
                                break;
                        }
                    }
                });

            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // Native Safari HLS
                video.src = url;
                attemptAutoplay();
            } else {
                statusMsg.innerText = 'HLS streaming is not supported on this browser.';
            }
        }

        // Handle Browser Autoplay Policies
        function attemptAutoplay() {
            video.muted = true; // Mute initially to guarantee autoplay permission
            const playPromise = video.play();

            if (playPromise !== undefined) {
                playPromise.then(() => {
                    centerOverlay.classList.add('hidden');
                }).catch(() => {
                    // Autoplay blocked by browser policy -> show click-to-play button
                    loadingSpinner.style.display = 'none';
                    statusMsg.innerText = 'Click to start live stream audio & video:';
                    btnPlayAction.style.display = 'flex';
                });
            }
        }

        btnPlayAction.addEventListener('click', () => {
            video.muted = false;
            video.play().then(() => {
                centerOverlay.classList.add('hidden');
            });
        });

        // Periodic Telemetry Updates
        setInterval(() => {
            if (video && !video.paused) {
                // Resolution
                if (video.videoWidth) {
                    telRes.innerText = `${video.videoWidth}x${video.videoHeight}`;
                }

                // Buffer Ahead
                if (video.buffered.length > 0) {
                    const current = video.currentTime;
                    for (let i = 0; i < video.buffered.length; i++) {
                        if (video.buffered.start(i) <= current && current <= video.buffered.end(i)) {
                            const bufferAhead = video.buffered.end(i) - current;
                            telBuffer.innerText = `${bufferAhead.toFixed(1)}s`;
                            break;
                        }
                    }
                }

                // Dropped frames
                if (video.getVideoPlaybackQuality) {
                    const q = video.getVideoPlaybackQuality();
                    telDropped.innerText = q.droppedVideoFrames || 0;
                }
            }
        }, 1000);

        // Start
        window.addEventListener('DOMContentLoaded', resolveStream);
    </script>
</body>
</html>
