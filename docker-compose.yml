# ==============================================================================
# Live Streaming Infrastructure & Admin Dashboard Stack
# Architecture:
# 1. MediaMTX (bluenviron/mediamtx:1.21.3-ffmpeg) - RTMP Ingest & HLS Packaging
# 2. Backend (Node.js + FFmpeg) - Admin Panel, Restreamer Manager & R2 Uploader
# 3. Nginx Edge (nginx:alpine) - Camouflaged Caching (.css/.js), SSL & Player Hosting
# ==============================================================================

services:
  # ============================================================================
  # 1. MediaMTX Live Ingestion & HLS Transmuxer
  # Ingests OBS RTMP pushes and FFmpeg pull restreams on port 1935
  # ============================================================================
  mediamtx:
    # Pinned: mediamtx.yml (auth keys, regex path names) is validated against 1.21.3
    image: bluenviron/mediamtx:1.21.3-ffmpeg
    container_name: stream_mediamtx
    restart: unless-stopped
    ports:
      - "1935:1935"   # Public RTMP ingestion port
    expose:
      - "8554"        # Internal RTSP relay for FFmpeg packaging hook
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
      - hls_data:/hls
    networks:
      - streaming_net
    # Publish/read authorization is delegated to the backend (authHTTPAddress in mediamtx.yml)
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ============================================================================
  # 2. Live Streaming Backend, Admin Panel & Cloudflare R2 Pipeline
  # Admin Dashboard, Channel Management, FFmpeg Restreamer & R2 Real-Time Watcher
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stream_backend
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - PORT=3000
      - NODE_ENV=${NODE_ENV:-production}
      - ADMIN_USERNAME=${ADMIN_USERNAME:?ADMIN_USERNAME is required (see .env.example)}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD is required, min 12 chars (see .env.example)}
      - ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET:?ADMIN_JWT_SECRET is required - generate with openssl rand -hex 48}
      - VIEWER_JWT_SECRET=${VIEWER_JWT_SECRET:?VIEWER_JWT_SECRET is required - generate with openssl rand -hex 48}
      - SERVER_IP=${SERVER_IP:?SERVER_IP is required (public IP for RTMP ingest)}
      - EDGE_DOMAIN=${EDGE_DOMAIN:?EDGE_DOMAIN is required (public HTTPS domain)}
      - R2_CUSTOM_DOMAIN=${R2_CUSTOM_DOMAIN:-r2-custom-domain.shop}
      # Secret R2 paths (rotating playlist keys, unguessable segment names). Same value as the
      # data Worker's STREAM_PATH_SECRET. Empty = old public layout.
      - STREAM_PATH_SECRET=${STREAM_PATH_SECRET:-}
      - R2_WINDOW_SECONDS=${R2_WINDOW_SECONDS:-600}
      - R2_NATIVE_WINDOW_SECONDS=${R2_NATIVE_WINDOW_SECONDS:-7200}
      # true while players older than the secret-path player may still be open; then false
      - R2_LEGACY_PLAYLIST=${R2_LEGACY_PLAYLIST:-true}
      - MEDIAMTX_RTMP_HOST=mediamtx
      - MEDIAMTX_RTMP_PORT=1935
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-live-streams}
      - R2_ENDPOINT=${R2_ENDPOINT:-}
      - HLS_DIR=/hls
      - DATA_FILE=/app/data/channels.json
      - MAX_SEGMENT_AGE_SECONDS=${MAX_SEGMENT_AGE_SECONDS:-120}
      # R2 playlist edge cache in seconds (0 = old no-store) and uploaded playlist copies (html,css)
      - R2_PLAYLIST_MAX_AGE=${R2_PLAYLIST_MAX_AGE:-1}
      - R2_PLAYLIST_FILES=${R2_PLAYLIST_FILES:-html}
      - ENABLE_AUTH_ON_PLAYLISTS=${ENABLE_AUTH_ON_PLAYLISTS:-true}
      - TOKEN_EXPIRATION_SECONDS=${TOKEN_EXPIRATION_SECONDS:-45}
      - TOKEN_RENEW_GRACE_SECONDS=${TOKEN_RENEW_GRACE_SECONDS:-10}
      - VIEWER_TOKEN_BIND=${VIEWER_TOKEN_BIND:-ua}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - ADMIN_ALLOWED_ORIGINS=${ADMIN_ALLOWED_ORIGINS:-}
      - RESTREAM_MAX_RETRIES=${RESTREAM_MAX_RETRIES:-0}
      - RESTREAM_COPY_AUDIO=${RESTREAM_COPY_AUDIO:-false}
      - RESTREAM_PROFILE=${RESTREAM_PROFILE:-480p}
      # empty = profile default (480p: 1000k, 720p: 2500k)
      - RESTREAM_VIDEO_KBPS=${RESTREAM_VIDEO_KBPS:-}
      # Selectable "HD" rendition (live/{key}-hd -> R2 hd/{slug}/hd/index.html); the player starts
      # on the profile above. encode = H.264 720p25 ultrafast (works in every browser),
      # copy = source passthrough (H.264 sources only; HEVC plays black in Chrome), off = none.
      # Fallback if the server overloads (robotic audio): RESTREAM_HD_MODE=off + RESTREAM_PROFILE=720p
      - RESTREAM_HD_MODE=${RESTREAM_HD_MODE:-encode}
      # Core protection: HD is switched on per channel in the admin panel; at most this many
      # channels encode HD at once. 0 = no HD encodes (default: the 4 vCPUs go to 4 concurrent
      # channels b1..b4; 4 HEVC 1080p50 sources need ~4.7 cores even without HD, see README).
      - MAX_HD_ENCODES=${MAX_HD_ENCODES:-0}
      - RESTREAM_HD_PRESET=${RESTREAM_HD_PRESET:-ultrafast}
      - RESTREAM_HD_KBPS=${RESTREAM_HD_KBPS:-2500}
      # empty = superfast while the HD encode runs, else veryfast
      - RESTREAM_X264_PRESET=${RESTREAM_X264_PRESET:-}
      - RESTREAM_FPS=${RESTREAM_FPS:-25}
      - RESTREAM_ENHANCE=${RESTREAM_ENHANCE:-true}
      - RESTREAM_SHARPEN=${RESTREAM_SHARPEN:-none}
    volumes:
      # read-write: the backend prunes stale local HLS files (> 5 min old)
      - hls_data:/hls
      - backend_data:/app/data
    networks:
      - streaming_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ============================================================================
  # 3. Nginx Edge Reverse Proxy, Caching & Obfuscation Engine
  # Masks .m3u8 as .css, masks .ts as .js, caches segments via proxy_cache
  # ============================================================================
  nginx:
    image: nginx:alpine
    container_name: stream_nginx
    restart: unless-stopped
    ports:
      - "80:80"       # HTTP edge traffic & Let's Encrypt ACME challenge
      - "443:443"     # Production HTTPS edge traffic
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./certs:/etc/nginx/certs:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./player:/var/www/player:ro
      - hls_data:/hls:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      backend:
        condition: service_healthy
      mediamtx:
        condition: service_started
    networks:
      - streaming_net
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

volumes:
  hls_data:
    driver: local
  nginx_cache:
    driver: local
  backend_data:
    driver: local

networks:
  streaming_net:
    driver: bridge
