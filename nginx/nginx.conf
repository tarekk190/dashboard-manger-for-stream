# ==============================================================================
# High-Scale Live Streaming Nginx Edge Reverse Proxy
# Architecture: Obfuscated HLS (.css / .js) + CDN Proxy Cache + TLS + Admin & Player
# Target Concurrency: 10,000+ Viewers
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 16384;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance & Network optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    # Longer than before (65s) so the origin does not close connections Cloudflare is about
    # to reuse (a common cause of sporadic 520/522 behind Cloudflare)
    keepalive_timeout 300s;
    keepalive_requests 10000;
    types_hash_max_size 2048;
    server_tokens off;

    # Buffer tuning for high-throughput live streaming
    client_body_buffer_size 128k;
    client_max_body_size 10m;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;

    # Gzip settings for text payloads
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    # (media segments are served as application/javascript but turn gzip off in their location)

    # ==========================================================================
    # Real client IP behind Cloudflare (logs, rate limiting, auth X-Real-IP).
    # Source: https://www.cloudflare.com/ips/ - re-check occasionally. Requests that do not
    # come from these ranges keep their own address (CF-Connecting-IP is ignored).
    # ==========================================================================
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Logging format optimized for streaming metrics & cache tracking
    log_format streaming_json escape=json '{'
        '"time_local":"$time_local",'
        '"client_ip":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"uri":"$uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_cache_status":"$upstream_cache_status",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
    '}';

    access_log /var/log/nginx/access.log streaming_json;
    error_log /var/log/nginx/error.log warn;

    # ==========================================================================
    # Proxy Cache Configuration for Media Segments (.js)
    # ==========================================================================
    proxy_cache_path /var/cache/nginx/hls
                     levels=1:2
                     keys_zone=HLS_CACHE:100m
                     max_size=20g
                     inactive=10m
                     use_temp_path=off;

    # ==========================================================================
    # Proxy Cache Configuration for Internal Auth Subrequests
    # ==========================================================================
    proxy_cache_path /var/cache/nginx/auth
                     levels=1:2
                     keys_zone=AUTH_CACHE:10m
                     max_size=1g
                     inactive=1m
                     use_temp_path=off;

    # ==========================================================================
    # CORS: only origins listed in snippets/allowed-origins.conf are echoed back.
    # Unlisted origins get an empty value, and nginx omits empty add_header values.
    # ==========================================================================
    map $http_origin $cors_origin {
        default "";
        include /etc/nginx/snippets/allowed-origins.conf;
    }

    # ==========================================================================
    # Upstream Definitions
    # ==========================================================================
    upstream backend_service {
        server backend:3000;
        keepalive 32;
    }

    upstream internal_origin {
        server 127.0.0.1:8088;
        keepalive 64;
    }

    # ==========================================================================
    # Internal Origin Server (Listens on 127.0.0.1:8088)
    # Serves generated HLS segments and playlists directly from the shared /hls volume
    # ==========================================================================
    server {
        listen 127.0.0.1:8088;
        server_name 127.0.0.1;

        root /hls;

        location / {
            try_files $uri =404;
        }

        # Camouflage MIME types are set here at the origin. The edge must NOT use
        # proxy_hide_header Content-Type: that clears the content type, which silently
        # disables sub_filter (playlists would keep listing .ts instead of .js).
        location ~ \.m3u8$ {
            types { }
            default_type text/css;
            charset utf-8;
            charset_types text/css;
            try_files $uri =404;
        }

        location ~ \.ts$ {
            gzip off;   # never compress video segments
            types { }
            default_type application/javascript;
            try_files $uri =404;
        }
    }

    # ==========================================================================
    # HTTP Server (Port 80)
    # Only serves ACME challenges; everything else is redirected to HTTPS
    # ==========================================================================
    # Only the platform hostname is served. Any other Host / SNI (old domains, the bare IP,
    # scanners) hits the default servers below: port 80 closes the connection, port 443
    # refuses the TLS handshake. Cloudflare always sends the real hostname as SNI.
    # To change the domain, edit server_name in both servers below and snippets/referer-lock.conf.
    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }

    server {
        listen 80;
        server_name live.smarterwho.site;

        # ACME challenge support for automated SSL renewal (webroot mounted from ./certbot/www)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        # Listen options (reuseport, backlog) may appear only once per address:port, so they
        # live on this default server.
        # reuseport: one accept queue per worker; backlog: room for connection bursts
        # (needs net.core.somaxconn / tcp_max_syn_backlog >= 8192 on the host)
        listen 443 ssl default_server reuseport backlog=8192;
        server_name _;
        ssl_reject_handshake on;
    }

    # ==========================================================================
    # Production HTTPS Server (Port 443 with TLS 1.2/1.3 & HTTP/2)
    # ==========================================================================
    server {
        listen 443 ssl;
        http2 on;
        server_name live.smarterwho.site;

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Plain max-age only: no includeSubDomains/preload unless you deliberately opt in
        add_header Strict-Transport-Security "max-age=63072000" always;

        # ACME challenges also on HTTPS: behind Cloudflare with "Always Use HTTPS", Let's Encrypt's
        # http:// check is redirected to https:// and must still find the challenge file
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
        }

        # Include all streaming, camouflage, cache, and auth locations
        include /etc/nginx/snippets/stream-locations.conf;
    }
}
