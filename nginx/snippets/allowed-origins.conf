# ==============================================================================
# Allowed CORS Origins Configuration Snippet
# Evaluated inside `map $http_origin $cors_origin`
# ==============================================================================

# Localhost and local IP bindings (with optional port)
"~^https?://(?:localhost|127\.0\.0\.1)(?::\d+)?$" $http_origin;

# The bundled player is served from EDGE_DOMAIN itself (same-origin) and needs no entry.
# Add only third-party sites that load playlists/segments directly (not via the iframe).
# Add custom production domain regex or strings below:
# "~^https?://(?:[a-zA-Z0-9-]+\.)*example\.com(?::\d+)?$" $http_origin;
