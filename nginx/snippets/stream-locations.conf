# ==============================================================================
# Shared Streaming, Camouflage & Edge Routing Locations Snippet
# Included only in the HTTPS (Port 443) server block; port 80 redirects to HTTPS
#
# NOTE: any location (or if-block) with its own add_header stops inheriting the
# server-level add_header, so those blocks repeat the Strict-Transport-Security header.
# ==============================================================================

# Root landing redirect to Admin Dashboard
location = / {
    return 302 /admin;
}

# Static Frontend Player Hosting (hls.js web player)
location /player/ {
    alias /var/www/player/;
    index index.html;
    try_files $uri $uri/ /player/index.html;
    add_header Cache-Control "no-cache, must-revalidate" always;
    # Domain lock: the player may only be framed by this edge domain and the blogs that embed
    # it (normal theme, blogger/px-league-theme.xml): www.px-league.site, its apex and
    # tariq-live.blogspot.com. Every other site gets a blocked frame. For local testing open
    # the player directly (/player/?channel=...).
    # No X-Frame-Options: it cannot allow a second origin, and CSP frame-ancestors supersedes
    # it in every current browser.
    add_header Content-Security-Policy "frame-ancestors 'self' https://www.px-league.site https://px-league.site https://tariq-live.blogspot.com" always;
    add_header Strict-Transport-Security "max-age=63072000" always;
}

# Admin Control Panel Reverse Proxy
location /admin {
    proxy_pass http://backend_service;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Server-Sent Events: live restream log stream (long-lived, must not be buffered)
location ~ ^/api/channels/[^/]+/restream/logs/stream$ {
    proxy_pass http://backend_service;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
}

# Dynamic Backend REST API
location /api/ {
    proxy_pass http://backend_service/api/;
    proxy_http_version 1.1;
    # No websockets here; "" keeps upstream keepalive working
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # CORS is handled by the backend: ALLOWED_ORIGINS for /api/stream and /api/token only,
    # admin endpoints are same-origin only. No CORS headers are added here.
}

# Internal Auth Validation Subrequest with Micro-Caching
location = /auth {
    internal;
    proxy_pass http://backend_service/auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Original-Method $request_method;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Auth caching: avoids hammering Node backend with thousands of subrequests.
    # The key must describe the ORIGINAL request: inside this subrequest $uri is "/auth" and
    # $arg_token is empty, so the parent locations copy the channel and ?token= into
    # $auth_channel / $auth_token (subrequests share the parent request's variables).
    # $cookie_stream_auth must be part of the key: cookie-only requests (native Safari) would
    # otherwise share one cache entry with token-less requests and inherit a cached 200.
    # $http_user_agent and $remote_addr are part of it too: tokens are bound to the client
    # (VIEWER_TOKEN_BIND), so a copied token replayed from another client must reach Node and
    # fail there instead of reusing the owner's cached 200.
    proxy_cache AUTH_CACHE;
    proxy_cache_key "$auth_channel|$auth_token|$http_authorization|$cookie_stream_auth|$http_user_agent|$remote_addr";
    # A 200 is reused for 20s: with playlist reloads every ~2s this sends ~1 of 10 reloads per
    # viewer to Node (~500 req/s for 10,000 viewers, cheap JWT checks). Tokens live 45s
    # (TOKEN_EXPIRATION_SECONDS), so an expired token is accepted at most 20s longer.
    proxy_cache_valid 200 20s;
    proxy_cache_valid 401 403 1s;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 2s;
    proxy_ignore_headers Cache-Control Expires Set-Cookie;
    proxy_hide_header Set-Cookie;
}

# ==============================================================================
# Rule 1: HLS Playlists Masked as .css (Camouflage + Strict No-Store Cache)
# Example: https://edge-domain.com/live/{stream_key}/index.css
# ==============================================================================
location ~* ^/(live|hls)/([^/.]+)(/.*)?\.css$ {
    # Domain lock (403 for other sites / missing Referer)
    include /etc/nginx/snippets/referer-lock.conf;

    # Original-request values for the /auth cache key (must be set before the rewrites)
    set $auth_channel $2;
    set $auth_token $arg_token;

    if ($request_method = 'OPTIONS') {
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Range, Content-Type" always;
        add_header Vary Origin always;
        add_header Access-Control-Max-Age 86400;
        add_header Strict-Transport-Security "max-age=63072000" always;
        return 204;
    }

    # Internal subrequest auth (checked against backend /auth)
    auth_request /auth;

    # Map requested .css path back to the actual .m3u8 on disk
    rewrite ^/(live|hls)/([^/]+)/.*\.css$ /$1/$2/index.m3u8 break;
    rewrite ^/(live|hls)/([^/]+)\.css$ /$1/$2/index.m3u8 break;
    rewrite ^/(live|hls)/(.+)\.css$ /$1/$2.m3u8 break;

    proxy_pass http://internal_origin;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;

    # Strip Accept-Encoding so upstream returns plain text for sub_filter
    proxy_set_header Accept-Encoding "";

    # On-the-fly manifest rewriting: mask .ts segments as .js
    sub_filter '.ts' '.js';
    sub_filter '.m3u8' '.css';
    sub_filter_once off;
    sub_filter_types application/vnd.apple.mpegurl application/x-mpegurl text/plain text/css;

    # Strict live manifest caching policy (never cache playlists on CDN or client)
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;

    # Content-Type "text/css; charset=utf-8" comes from the internal origin (see nginx.conf);
    # hiding/re-adding it here would disable sub_filter.

    # CORS for allow-listed cross-domain embedded players
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Range, Content-Type" always;
    add_header Vary Origin always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;
    add_header Strict-Transport-Security "max-age=63072000" always;
}

# ==============================================================================
# Rule 2: Media Segments Masked as .js (High-Scale Edge Proxy Caching)
# Example: https://edge-domain.com/live/{stream_key}/seg_1794671902.js
#
# Segments are intentionally NOT token-protected: access control happens on the
# playlist (.css) only, so segment URLs stay identical for every viewer (100%
# cacheable on Cloudflare/nginx, and native Safari can fetch them without headers).
# Trade-off: segment names are predictable (epoch numbers); the domain lock (Referer)
# keeps other sites' browsers out, but non-browser clients can forge a Referer.
# ==============================================================================
location ~* ^/(live|hls)/([^/.]+)/(.+)\.js$ {
    # Domain lock (403 for other sites / missing Referer)
    include /etc/nginx/snippets/referer-lock.conf;

    # Video is already compressed: gzip wasted CPU on every request (~15% saving) and
    # turned Range requests (206) into full 200 responses. The compression happened at the
    # internal origin, so the client's Accept-Encoding is not forwarded either (this also
    # keeps the single cached copy, key = $uri, identical for every client).
    gzip off;
    proxy_set_header Accept-Encoding "";

    # Map requested .js segment back to real .ts on disk
    rewrite ^/(live|hls)/(.*)\.js$ /$1/$2.ts break;

    # Edge Proxy Cache configuration for video segments
    proxy_cache HLS_CACHE;
    proxy_cache_key $uri;

    # Thundering herd protection: only 1 request goes upstream, others wait
    proxy_cache_lock on;
    proxy_cache_lock_timeout 5s;
    proxy_cache_lock_age 5s;

    # Caching rules: 200/206 cached for 60 seconds
    proxy_cache_valid 200 206 60s;
    proxy_cache_valid 404 1s;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

    # Segments must stay cookie-free in both directions (CDN cacheability):
    # never forward the viewer's Cookie upstream and never emit Set-Cookie.
    proxy_ignore_headers Cache-Control Expires Set-Cookie;
    proxy_hide_header Set-Cookie;
    proxy_set_header Cookie "";

    proxy_pass http://internal_origin;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;

    # Content-Type "application/javascript" comes from the internal origin (see nginx.conf)

    # Strict public cache header for Cloudflare CDN & browser cache
    add_header Cache-Control "public, max-age=60, immutable" always;
    add_header X-Cache-Status $upstream_cache_status always;

    # No CORS headers on purpose: the player is same-origin (needs none) and other sites'
    # browsers must not be able to read segments. Identical headers for every viewer and
    # no Vary: Origin, so the response stays CDN-cacheable.
    add_header Strict-Transport-Security "max-age=63072000" always;
}

# ==============================================================================
# Rule 3: Raw .m3u8 / .ts (and anything else under /live, /hls) is never served
# ==============================================================================
location ~* ^/(live|hls)/ {
    return 404;
}
