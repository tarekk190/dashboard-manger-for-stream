# ==============================================================================
# Strict domain lock for HLS playlists (.css) and segments (.js)
# Included at the top of both HLS locations in stream-locations.conf.
#
# Only browsers playing from pages on these hosts are served; anything else
# (hotlinking from another site, requests without a Referer) gets 403.
# Change the host list here if the player domain changes.
#
# Limits (by design of HTTP, not of this config):
# - The Referer header is set by browsers; non-browser clients (curl, VLC, scrapers)
#   can forge it. The playlist token remains the real access control.
# - Embedding the /player/ page itself in a foreign iframe is blocked separately with
#   frame-ancestors / X-Frame-Options on the /player/ location (the player's own
#   requests would carry this domain as Referer and pass this check).
# - Behind a CDN, cached segments are served by the CDN without reaching this check;
#   mirror the rule in the CDN (see README).
# ==============================================================================
valid_referers live.vsbskl.site;

if ($invalid_referer) {
    return 403;
}
