# PX League API proxy. Mirrors the settings of the live Worker (version b05d6ae6, 2026-11-16)
# so `npx wrangler deploy` does not drop its existing bindings.
name = "px-league-proxy"
main = "src/index.js"
compatibility_date = "2026-10-01"

# -----------------------------------------------------------------------------
# Custom domain: https://data.px-league.site  (zone px-league.site, active on Cloudflare)
# The theme (PXL_WORKER_BASE_URL) and the stream-manager dashboard call this address. The
# Cache API (edge response cache + last-good fallback in src/index.js) only works here, not on
# *.workers.dev. Wrangler manages the DNS record and certificate of a custom domain; if the
# domain was attached in the dashboard first, the deploy adopts it.
# Check after a deploy (second answer must say X-PXL-Edge: HIT):
#   curl -sI -H "Origin: https://www.px-league.site" https://data.px-league.site/api/standings/<id>
routes = [
  { pattern = "data.px-league.site", custom_domain = true }
]

# The old px-league-proxy.pxleague.workers.dev address stays reachable for clients that may
# still use it (pages cached before the switch, older app builds). It has no edge cache.
# Set to false (and deploy) once its traffic in the Worker analytics has dropped to zero.
workers_dev = true
#
# Match-day traffic: every request invokes the Worker even when it is answered from the edge
# cache. A live match page polls 3 endpoints every 10 s (18 requests/min per viewer), so
# 10,000 viewers make ~3.6M requests in a 2-hour match: the Free plan (100k/day) is not
# enough; use Workers Paid (10M requests/month included).
# -----------------------------------------------------------------------------

[vars]
# Blog origins (added to the list hard-coded in src/index.js; scheme + host, comma separated)
ALLOWED_ORIGINS = "https://www.px-league.site,https://px-league.site,https://powerdoflearn.blogspot.com"
# Stream-enabled origins: match data for these carries "stream": { channel, r2_slug } (pages that
# embed our player, live.smarterwho.site/player/). They are allowed origins as well.
STREAM_ORIGINS = "https://www.px-league.site,https://px-league.site,https://tariq-live.blogspot.com"
# Origins allowed to use ?raw=1 (scheme + host only, no path; comma separated)
DASHBOARD_ORIGINS = "https://tarekk190.github.io"

# Per-IP rate limit, used by src/index.js on every endpoint (429 + Retry-After: 60 when hit).
# period must be 10 or 60 seconds. One live viewer makes ~18 requests/min; mobile carriers
# share one IP between many users (CGNAT), so 600/min (~30 live viewers per IP) leaves room
# for them while still cutting off scrapers polling in a loop. Counted per Cloudflare
# location, eventually consistent: a brake, not an exact quota.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "7001"
simple = { limit = 600, period = 60 }

# Secrets (set once, kept across deploys):
#   npx wrangler secret put SUPABASE_URL
#   npx wrangler secret put SUPABASE_ANON_KEY
